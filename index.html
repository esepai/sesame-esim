<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Сезам eSIM — интернет в 200 странах без роуминга</title>
<meta name="description" content="eSIM для поездок: QR-код через минуту после оплаты, 200 стран, поддержка 24/7.">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%230A0A0A%22/%3E%3Cpath%20d%3D%22M27%2012A20%2020%200%200%200%2027%2052%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%226%22%20stroke-linecap%3D%22round%22/%3E%3Cpath%20d%3D%22M37%2012A20%2020%200%200%201%2037%2052%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%226%22%20stroke-linecap%3D%22round%22/%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2232%22%20r%3D%227%22%20fill%3D%22%23F5B82E%22/%3E%3C/svg%3E">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Сезам">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta property="og:type" content="website">
<meta property="og:title" content="Сезам eSIM — интернет в 200 странах без роуминга">
<meta property="og:description" content="eSIM для поездок: QR-код через минуту после оплаты, 200 стран, поддержка 24/7.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff; --ink:#0A0A0A; --soft:#F5F5F4; --soft2:#EDEDEB; --card:#fff; --muted:#6E6E73; --line:#E7E7E5;
  --gold:#F5B82E; --ok:#1A9E5C; --no:#D93A2B; --warn:#C77C00;
  --h:'Inter Tight','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B0B0C; --ink:#F2F2F0; --soft:#161618; --soft2:#202023; --card:#161618; --muted:#9A9AA0; --line:#26262A; --ok:#3CC57F; --no:#FF6B57; --warn:#F2A93B;
}}
:root[data-theme="dark"]{
  --bg:#0B0B0C; --ink:#F2F2F0; --soft:#161618; --soft2:#202023; --card:#161618; --muted:#9A9AA0; --line:#26262A; --ok:#3CC57F; --no:#FF6B57; --warn:#F2A93B;
}
*,*::before,*::after{box-sizing:inherit}
html{overflow-x:clip;scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px)}
body{margin:0;overflow-x:clip;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit} button{font:inherit;color:inherit;cursor:pointer}
img,svg{max-width:100%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:8px}
.w{width:min(1200px,100% - 40px);margin-inline:auto}
h1,h2,h3{margin:0;font-family:var(--h);font-weight:600;letter-spacing:-.035em;line-height:1.04}
h2{font-size:clamp(32px,4.6vw,58px)}
h3{font-size:22px;letter-spacing:-.02em}
p{margin:0}
.muted{color:var(--muted)}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.center{text-align:center;margin-inline:auto}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:14px 24px;font-weight:600;font-size:16px;text-decoration:none;transition:opacity .2s,transform .15s;white-space:nowrap}
.btn:hover{opacity:.86}
.btn:active{transform:scale(.98)}
.btn-ink{background:var(--ink);color:var(--bg)}
.btn-soft{background:var(--soft2)}
.btn-gold{background:var(--gold);color:#0A0A0A}
.btn-sm{padding:10px 18px;font-size:15px}

.fl{display:inline-block;font-size:20px;line-height:1;flex:none}
.fl.code{font-size:11px;font-weight:700;background:var(--soft2);color:var(--muted);border-radius:5px;padding:4px 5px;letter-spacing:.02em}

/* header */
header.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding-top:env(safe-area-inset-top,0px);transition:box-shadow .3s}
header.top.sh{box-shadow:0 1px 0 var(--line)}
header.top .w{display:flex;align-items:center;gap:24px;height:68px}
header.top .logo{flex:1 1 0}
header.top .hdr-r{flex:1 1 0}
.logo{display:flex;align-items:center;gap:9px;text-decoration:none;font-family:var(--h);font-weight:700;font-size:22px;letter-spacing:-.04em}
.logo svg{width:28px;height:28px;flex:none;color:var(--ink)}
nav.menu{display:flex;gap:30px}
nav.menu a{text-decoration:none;font-weight:500;font-size:15px;color:var(--muted)}
nav.menu a:hover{color:var(--ink)}
.hdr-r{display:flex;justify-content:flex-end;align-items:center;gap:6px}
.cur{display:inline-flex;gap:2px}
.cur button{border:0;background:none;padding:8px 10px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted)}
.cur button[aria-pressed="true"]{color:var(--ink);background:var(--soft)}
.signin{text-decoration:none;font-weight:500;font-size:15px;padding:8px 12px;white-space:nowrap}
nav.menu a{white-space:nowrap}
@media (max-width:1240px){nav.menu{gap:22px}header.top .logo,header.top .hdr-r{flex:none}nav.menu{margin-inline:auto}}
@media (max-width:1100px){nav.menu a[href="#app"]{display:none}}
@media (max-width:900px){nav.menu,.signin{display:none}header.top .w{justify-content:space-between}}

.lang{display:inline-flex;gap:2px;margin-right:4px}
.lang button{border:0;background:none;padding:8px 10px;border-radius:999px;font-weight:600;font-size:13.5px;color:var(--muted)}
.lang button[aria-pressed="true"]{color:var(--ink);background:var(--soft)}
/* hero */
.hero{padding-top:clamp(56px,8vw,96px);text-align:center}
.hero h1{font-size:clamp(40px,6.6vw,84px);max-width:13ch;margin-inline:auto}
.hero h1 .hl{color:var(--gold)}
.hero .lead{font-size:clamp(17px,1.6vw,20px);color:var(--muted);margin:22px auto 0;max-width:34em}
.search{position:relative;max-width:560px;margin:34px auto 0;text-align:left}
.sbox{display:flex;align-items:center;gap:10px;background:var(--soft);border:1px solid transparent;border-radius:999px;padding:6px 6px 6px 20px;transition:border-color .2s,background .2s}
.sbox:focus-within{border-color:var(--ink);background:var(--bg)}
.sbox .ic{color:var(--muted)}
.sbox input{flex:1;min-width:0;border:0;outline:none;background:none;font:inherit;font-size:17px;color:var(--ink);padding:11px 0}
.sbox input::placeholder{color:var(--muted)}
.sugg{position:absolute;z-index:30;left:0;right:0;top:calc(100% + 8px);background:var(--bg);border:1px solid var(--line);border-radius:18px;box-shadow:0 20px 50px rgba(0,0,0,.1);padding:6px;margin:0;list-style:none;max-height:340px;overflow:auto}
.sugg[hidden]{display:none}
.sugg li{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;cursor:pointer;font-weight:500}
.sugg li[aria-selected="true"],.sugg li:hover{background:var(--soft)}
.sugg .pr{margin-left:auto;color:var(--muted);font-size:15px}
.sugg .empty{color:var(--muted);cursor:default}
.pop{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 18px;margin-top:16px;font-size:15px;color:var(--muted)}
.pop button{border:0;background:none;padding:2px 0;color:var(--muted);font-size:15px;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px}
.pop button:hover{color:var(--ink);text-decoration-color:currentColor}

/* globe panel */
.gp{position:relative;margin:clamp(44px,6vw,68px) auto 0;width:min(1240px,100% - 24px);height:clamp(500px,58vw,720px);background:#0A0A0A;color:#fff;border-radius:44px;overflow:hidden;touch-action:pan-y;cursor:grab;isolation:isolate}
.gp:active{cursor:grabbing}
.gp canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.g-count{position:absolute;left:clamp(20px,3vw,36px);top:clamp(20px,3vw,32px);display:flex;align-items:baseline;gap:10px;opacity:0;transition:opacity .6s}
.gp.on .g-count{opacity:1}
.g-count b{font-family:var(--h);font-weight:600;font-size:clamp(34px,4vw,52px);letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1}
.g-count span{color:rgba(255,255,255,.55);font-size:15px}
.g-say{position:absolute;left:50%;bottom:clamp(22px,3vw,34px);transform:translateX(-50%);white-space:nowrap;font-family:var(--h);font-weight:500;font-size:clamp(18px,2vw,24px);letter-spacing:-.02em;color:#fff;min-height:1.3em}
.g-say .caret{display:inline-block;width:2px;height:1em;background:#F5B82E;margin-left:3px;vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.g-hint{position:absolute;left:clamp(20px,3vw,36px);bottom:clamp(24px,3vw,36px);font-size:14px;color:rgba(255,255,255,.45)}
.g-again{position:absolute;right:clamp(16px,3vw,30px);bottom:clamp(16px,3vw,26px);border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#fff;border-radius:999px;padding:10px 16px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .5s,background .2s}
.g-again:hover{background:rgba(255,255,255,.14)}
.gp.done .g-again{opacity:1;pointer-events:auto}
.gp.done .caret{display:none}
.g-again{white-space:nowrap}
@media (max-width:700px){.gp{border-radius:28px}.g-hint{display:none}.g-say{bottom:76px;font-size:16px}.g-again{left:50%;right:auto;transform:translateX(-50%)}}

/* dark blocks */
.dark{background:#0A0A0A;color:#F2F2F0}
.dark .muted,.dark p{color:rgba(255,255,255,.6)}

/* numbers */
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:clamp(56px,7vw,90px);text-align:center}
.nums b{display:block;font-family:var(--h);font-weight:600;font-size:clamp(36px,4.6vw,60px);letter-spacing:-.04em;line-height:1}
.nums span{color:var(--muted);font-size:15px}
@media (max-width:600px){.nums{grid-template-columns:1fr;gap:28px}}

section{margin-top:clamp(96px,11vw,150px)}
.sec-h{max-width:760px;margin-bottom:40px}
.sec-h.center{text-align:center}
.sec-h p{margin-top:14px;font-size:18px;color:var(--muted)}

[data-r]{opacity:0;transform:translateY(14px);transition:opacity .8s ease,transform .8s ease}
[data-r].in{opacity:1;transform:none}

/* catalog */
.seg{display:inline-flex;background:var(--soft);border-radius:999px;padding:4px;gap:2px}
.seg button{border:0;background:none;border-radius:999px;padding:9px 18px;font-weight:600;font-size:15px;color:var(--muted);transition:background .2s,color .2s}
.seg button[aria-selected="true"]{background:var(--bg);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.cat-top{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin-bottom:20px}
.cat-search{display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:999px;padding:0 16px;min-width:min(300px,100%)}
.cat-search .ic{color:var(--muted);width:18px;height:18px}
.cat-search input{border:0;background:none;outline:none;font:inherit;font-size:15px;padding:11px 0;width:100%;color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{display:flex;align-items:center;gap:12px;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:16px;padding:14px 16px;transition:border-color .2s,background .2s}
.tile:hover{border-color:var(--ink)}
.tile b{display:block;font-weight:600;font-size:15.5px;line-height:1.25}
.tile span.sub{font-size:13.5px;color:var(--muted)}
.tile .reg{width:32px;height:32px;border-radius:9px;background:var(--soft);display:grid;place-items:center;flex:none}
.tile .reg .ic{width:18px;height:18px;color:var(--muted)}
.letter{grid-column:1/-1;font-family:var(--h);font-weight:600;font-size:20px;margin:16px 0 0}
.cat-more{display:flex;justify-content:center;margin-top:24px}
.cat-empty{grid-column:1/-1;background:var(--soft);border-radius:16px;padding:26px;text-align:center}
@media (max-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}}
@media (max-width:720px){.grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:440px){.grid{grid-template-columns:1fr}}

/* explorer */
.xp-tabs{display:flex;justify-content:center;flex-wrap:wrap;gap:4px;margin-bottom:30px}
.xp-tabs button{position:relative;overflow:hidden;border:0;background:none;border-radius:999px;padding:9px 16px;font-weight:500;font-size:15px;color:var(--muted)}
.xp-tabs button[aria-selected="true"]{background:var(--soft);color:var(--ink)}
.xp-tabs .bar{position:absolute;left:16px;right:16px;bottom:4px;height:2px;border-radius:2px;background:var(--line);overflow:hidden;opacity:0}
.xp-tabs [aria-selected="true"] .bar{opacity:1}
.xp-tabs .bar i{position:absolute;inset:0;width:0;background:var(--ink)}
.xp-tabs [aria-selected="true"] .bar i{animation:xbar 5s linear forwards}
.xp.paused .xp-tabs .bar i{animation-play-state:paused}
@keyframes xbar{to{width:100%}}
.xp-box{background:#0A0A0A;border-radius:40px;padding:clamp(30px,4vw,56px) 0 0;overflow:hidden}
.xp-stage{position:relative;height:clamp(420px,40vw,540px);-webkit-mask:linear-gradient(90deg,transparent,#000 20%,#000 80%,transparent);mask:linear-gradient(90deg,transparent,#000 20%,#000 80%,transparent)}
.xp-stage .slot{position:absolute;left:50%;top:0;width:clamp(200px,19vw,250px);transition:transform .8s cubic-bezier(.2,.8,.2,1),opacity .8s;cursor:pointer}
.xp-stage .ms{font-size:clamp(9px,.9vw,11.5px);box-shadow:none}
.xp-cap{text-align:center;max-width:520px;margin:26px auto 0;min-height:96px}
.xp-cap h3{font-size:24px}
.xp-cap p{margin-top:8px;color:var(--muted)}
@media (max-width:700px){.xp-tabs{flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;scrollbar-width:none;margin-inline:-20px;padding:0 20px}.xp-tabs::-webkit-scrollbar{display:none}.xp-tabs button{flex:none}.xp-box{border-radius:28px}}

/* features */
.feats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.feat{display:flex;flex-direction:column}
.feat .pic{background:var(--soft);border-radius:32px;height:400px;overflow:hidden;display:flex;justify-content:center;padding-top:40px}
.feat .pic .ms{width:230px;font-size:10px;flex:none}
.feat h3{margin-top:22px}
.feat p{margin-top:8px;color:var(--muted)}
@media (max-width:900px){.feats{grid-template-columns:1fr}.feat .pic{height:360px}}

/* compat */
.compat{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.compat>*{min-width:0}
.cbox{border:1px solid var(--line);border-radius:28px;padding:26px}
.brands{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.brands button{border:0;background:var(--soft);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;color:var(--muted)}
.brands button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.models{display:grid;gap:6px}
.models button{display:flex;justify-content:space-between;align-items:center;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:13px 16px;font-weight:500}
.models button:hover,.models button[aria-pressed="true"]{border-color:var(--ink)}
.models .ic{width:16px;height:16px;color:var(--muted)}
.verdict{border-radius:28px;padding:32px;background:var(--soft);display:flex;flex-direction:column;justify-content:center;gap:10px;min-height:280px}
.vic{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--soft2)}
.vic .ic{width:24px;height:24px;stroke-width:2.2}
.verdict.yes .vic{background:var(--ok);color:#fff}.verdict.maybe .vic{background:var(--warn);color:#fff}.verdict.no .vic{background:var(--no);color:#fff}
.verdict h3{font-size:28px;margin-top:6px}
.verdict p{color:var(--muted)}
.code{font-weight:600;background:var(--bg);border-radius:6px;padding:1px 7px;color:var(--ink)}
@media (max-width:860px){.compat{grid-template-columns:1fr}}

/* terms */
.terms-wrap{border-radius:40px;padding:clamp(28px,5vw,64px)}
.terms-wrap .sec-h p{color:rgba(255,255,255,.6)}
.terms{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:rgba(255,255,255,.12);border-radius:24px;overflow:hidden}
.terms div{background:#0A0A0A;padding:26px}
.terms b{display:block;font-family:var(--h);font-weight:600;font-size:22px;letter-spacing:-.02em}
.terms span{color:rgba(255,255,255,.55);font-size:15px}
@media (max-width:860px){.terms{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.terms{grid-template-columns:1fr}}

/* faq */
.faq{max-width:820px;margin-inline:auto}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:18px;padding:22px 0;font-weight:600;font-size:18px}
.faq summary::-webkit-details-marker{display:none}
.faq summary .ic{transition:transform .25s;color:var(--muted)}
.faq details[open] summary .ic{transform:rotate(45deg)}
.faq .a{padding:0 0 22px;color:var(--muted);max-width:62ch}

/* support */
.support{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:stretch}
.support>*{min-width:0}
.sup-txt{border-radius:32px;background:var(--soft);padding:clamp(28px,4vw,48px);display:flex;flex-direction:column;justify-content:center}
.sup-txt p{margin-top:12px;color:var(--muted);font-size:18px;max-width:28em}
.sup-txt .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px}
.sup-pic{border-radius:32px;background:var(--soft);display:flex;justify-content:center;padding-top:40px;height:420px;overflow:hidden}
.sup-pic .ms{width:240px;font-size:10.5px;flex:none}
@media (max-width:860px){.support{grid-template-columns:1fr}}

/* app install */
.apps{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:16px}
.apps>*{min-width:0}
.app-c{position:relative;border-radius:32px;background:var(--soft);padding:clamp(24px,3vw,36px);display:flex;flex-direction:column;align-items:flex-start;gap:10px;box-shadow:inset 0 0 0 2px transparent;transition:box-shadow .2s}
.app-c.mine{box-shadow:inset 0 0 0 2px var(--ink)}
.app-c.dark{background:#0A0A0A;color:#F2F2F0}
.app-c h3{font-size:26px;margin-top:8px}
.app-c p{color:var(--muted)}
.app-c.dark p,.app-c.dark .app-pts{color:rgba(255,255,255,.62)}
.app-ic{width:64px;height:64px;border-radius:16px;display:grid;place-items:center;background:var(--bg);flex:none}
.app-ic img{width:64px;height:64px;border-radius:16px;display:block}
.app-ic svg{width:30px;height:30px;fill:currentColor}
.app-tag{position:absolute;top:22px;right:22px;font-size:12.5px;font-weight:600;border-radius:999px;padding:5px 11px;background:var(--gold);color:#0A0A0A}
.app-tag.soft{background:var(--soft2);color:var(--muted)}
.app-pts{list-style:none;padding:0;margin:4px 0 8px;display:grid;gap:7px;font-size:15px}
.app-pts li{display:flex;gap:9px;align-items:center}
.app-pts li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--gold);flex:none}
.app-c .btn{margin-top:auto}
.app-note{font-size:13.5px;min-height:1.3em}
.store-b{margin-top:auto;display:inline-flex;align-items:center;gap:11px;background:var(--ink);color:var(--bg);text-decoration:none;border-radius:14px;padding:9px 18px 9px 14px;transition:opacity .2s}
.store-b:hover{opacity:.86}
.store-b svg{width:24px;height:24px;fill:currentColor;flex:none}
.store-b span{display:flex;flex-direction:column;line-height:1.1}
.store-b small{font-size:11px;opacity:.75}
.store-b b{font-size:17px;font-weight:600;letter-spacing:-.01em}
@media (max-width:960px){.apps{grid-template-columns:1fr 1fr}.app-web{grid-column:1/-1}}
@media (max-width:600px){.apps{grid-template-columns:1fr}}

/* install dialog */
.dlg{border:0;padding:0;border-radius:28px;width:min(420px,calc(100% - 32px));background:var(--bg);color:var(--ink);box-shadow:0 30px 80px rgba(0,0,0,.25)}
.dlg::backdrop{background:rgba(0,0,0,.4)}
.dlg[open]{animation:dlgIn .3s cubic-bezier(.2,.9,.2,1)}
@keyframes dlgIn{from{opacity:0;transform:translateY(16px) scale(.98)}}
.dlg-in{padding:24px;display:flex;flex-direction:column;gap:14px}
.dlg-h{display:flex;align-items:center;gap:12px}
.dlg-h img{width:44px;height:44px;border-radius:11px}
.dlg-h b{font-size:19px;font-weight:600;font-family:var(--h);letter-spacing:-.02em;line-height:1.2}
.dlg-h .sh-x{margin-left:auto}
.dlg p{color:var(--muted)}
.dlg ol{list-style:none;padding:0;margin:0;display:grid;gap:8px;counter-reset:s}
.dlg ol li{display:flex;align-items:center;gap:12px;background:var(--soft);border-radius:16px;padding:12px 14px;counter-increment:s;font-weight:500}
.dlg ol li::before{content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:13px;font-weight:600;flex:none}
.dlg ol .ic{margin-left:auto;color:#0A84FF}
.dlg .btn{width:100%}
@media (max-width:560px){.dlg{margin:auto auto 0;width:100%;max-width:100%;border-radius:24px 24px 0 0}.dlg-in{padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}}

/* smart install bar (mobile) */
.abar{position:fixed;z-index:70;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:12px;background:var(--bg);border-radius:20px;padding:10px 10px 10px 12px;box-shadow:0 12px 40px rgba(0,0,0,.18),0 0 0 1px var(--line);transform:translateY(160%);transition:transform .45s cubic-bezier(.2,.9,.2,1)}
.abar.on{transform:none}
.abar img{width:42px;height:42px;border-radius:10px;flex:none}
.abar div{flex:1;min-width:0;line-height:1.25}
.abar b{display:block;font-size:15px;font-weight:600}
.abar span{font-size:13px;color:var(--muted)}
.abar .btn{padding:10px 16px;font-size:14.5px}
.abar .x{border:0;background:none;width:28px;height:28px;display:grid;place-items:center;color:var(--muted);flex:none;padding:0}
.abar .x .ic{width:16px;height:16px}
@media (min-width:701px){.abar{display:none}}

/* final */
.final{text-align:center;padding:clamp(56px,8vw,110px) 24px;border-radius:44px}
.final .btn-ink{background:#fff;color:#0A0A0A}
.final .btn-soft{background:rgba(255,255,255,.12);color:#fff}
.final svg.big{width:64px;height:64px;margin-bottom:26px;color:#fff}
.final h2{font-size:clamp(40px,6.6vw,84px)}
.final p{margin:18px auto 30px;color:var(--muted);font-size:18px;max-width:30em}
.final .row{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}

footer{margin-top:60px;padding:40px 0 34px;border-top:1px solid var(--line);font-size:14.5px;color:var(--muted)}
footer .w{display:grid;grid-template-columns:1.4fr repeat(3,1fr);gap:26px}
footer .w>*{min-width:0}
footer b{display:block;color:var(--ink);font-weight:600;margin-bottom:10px}
footer a{display:block;text-decoration:none;margin:5px 0}
footer a:hover{color:var(--ink)}
@media (max-width:760px){footer .w{grid-template-columns:1fr 1fr}}

/* mini screens */
.ms{position:relative;width:100%;aspect-ratio:9/19.5;border-radius:2.6em;background:#fff;color:#0A0A0A;overflow:hidden;font-family:var(--f);font-size:10.5px;line-height:1.35;padding:3.2em 1.3em 1.3em;box-shadow:0 0 0 1px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.05);text-align:left}
.ms::before{content:"";position:absolute;top:.85em;left:50%;transform:translateX(-50%);width:30%;height:1.5em;background:#0A0A0A;border-radius:1em}
.ms .tb{position:absolute;top:.9em;left:1.9em;right:1.9em;display:flex;justify-content:space-between;font-weight:600;font-size:.9em}
.ms h4{margin:.5em 0 .9em;font-family:var(--h);font-size:1.8em;font-weight:600;letter-spacing:-.03em;line-height:1.1}
.ms .sm{color:#86868B;font-size:.92em}
.ms .fl{font-size:1.5em}
.ms .rw{display:flex;align-items:center;gap:.7em;border-radius:1.1em;padding:.85em .9em;margin-top:.45em;font-weight:500;background:#F5F5F4}
.ms .rw .r{margin-left:auto;color:#86868B}
.ms .rw.on{background:#fff;box-shadow:inset 0 0 0 1.5px #0A0A0A}
.ms .b2{display:block;text-align:center;border-radius:2em;padding:1em;font-weight:600;margin-top:1em;background:#0A0A0A;color:#fff}
.ms .b2.lt{background:#F5F5F4;color:#0A0A0A}
.ms .cd{border-radius:1.5em;padding:1.2em;background:#0A0A0A;color:#fff}
.ms .sr2{display:flex;align-items:center;gap:.6em;background:#F5F5F4;border-radius:2em;padding:.9em 1.1em;color:#86868B}
.ms .sr2 .ic{width:1.3em;height:1.3em}
.ms .rg2{display:grid;place-items:center;width:8.5em;height:8.5em;margin:1em auto .7em;border-radius:50%;background:conic-gradient(#fff calc(var(--v)*1%),rgba(255,255,255,.14) 0)}
.ms .rg2>div{width:7.4em;height:7.4em;border-radius:50%;background:#0A0A0A;display:grid;place-items:center;text-align:center;line-height:1.15}
.ms .rg2 b{font-family:var(--h);font-size:1.9em;font-weight:600}
.ms .pill{border-radius:1em;padding:.15em .6em;font-size:.85em;font-weight:600;background:#1A9E5C;color:#fff}
.ms .qq{width:11.5em;height:11.5em;margin:1.2em auto;padding:.8em;border-radius:1.2em;background:#fff;box-shadow:0 0 0 1px #E7E7E5}
.ms .ok{width:3.2em;height:3.2em;border-radius:50%;display:grid;place-items:center;background:#1A9E5C;margin:.4em 0 .2em}
.ms .ok .ic{width:55%;height:55%;stroke:#fff;stroke-width:2.6}
.ms .stp{display:flex;gap:.8em;align-items:center;margin-top:.75em;font-weight:500}
.ms .stp i{flex:none;width:2em;height:2em;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:600;background:#F5F5F4;font-size:.95em}
.ms .stp.dn i{background:#0A0A0A;color:#fff}
.ms .tl{display:grid;grid-template-columns:1fr 1fr;gap:.5em;margin-top:.6em}
.ms .tl div{border-radius:1.1em;padding:.9em;font-weight:600;min-height:5.2em;display:flex;flex-direction:column;justify-content:flex-end;background:#F5F5F4}
.ms .tl div span{font-weight:400;color:#86868B;font-size:.88em}
.ms.lk{background:linear-gradient(180deg,#2B2B2E,#121214);color:#fff}
.ms.lk .tm{text-align:center;font-family:var(--h);font-weight:500;font-size:4.6em;letter-spacing:-.04em;margin-top:.45em;line-height:1}
.ms.lk .dt{text-align:center;opacity:.6;margin-bottom:1.3em}
.ms .nt{display:flex;gap:.7em;align-items:center;background:rgba(255,255,255,.12);border-radius:1.3em;padding:.85em;margin-top:.55em}
.ms .nt .ni{width:2.6em;height:2.6em;border-radius:.8em;background:#fff;display:grid;place-items:center;flex:none}
.ms .nt .ni svg{width:1.4em;height:1.6em;color:#0A0A0A;--bg:#fff}
.ms .nt b{display:block;font-weight:600;font-size:.95em}
.ms .nt span{font-size:.85em;opacity:.65}
.ms .bb{max-width:85%;padding:.75em 1em;border-radius:1.3em;margin-top:.6em}
.ms .bb.me{margin-left:auto;background:#0A0A0A;color:#fff;border-bottom-right-radius:.4em}
.ms .bb.th{background:#F5F5F4;border-bottom-left-radius:.4em}
.ms .ln{display:flex;justify-content:space-between;padding:.8em 0;border-bottom:1px solid #EFEFED}
.ms .ln b{font-weight:600}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .3s;z-index:80}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:90;top:12px;right:12px;bottom:12px;width:min(460px,calc(100% - 24px));background:var(--bg);border-radius:28px;display:flex;flex-direction:column;transform:translateX(calc(100% + 30px));transition:transform .45s cubic-bezier(.2,.9,.2,1);overflow:hidden}
.sheet.on{transform:none;box-shadow:0 30px 80px rgba(0,0,0,.2)}
.sh-h{display:flex;align-items:center;gap:12px;padding:18px 20px 12px}
.sh-h .fl{font-size:30px}
.sh-h b{display:block;font-size:18px;font-weight:600;line-height:1.2}
.sh-h span.s{font-size:14px;color:var(--muted)}
.sh-x,.back{border:0;background:var(--soft);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none}
.sh-x{margin-left:auto}
.sh-b{flex:1;overflow:auto;padding:6px 20px 20px}
.sh-f{padding:14px 20px calc(16px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.sh-f .btn{width:100%;padding:16px}
.sh-f .fine{text-align:center;font-size:13px;color:var(--muted);margin-top:9px}
.helper{border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:14px}
.helper b{font-size:14.5px;font-weight:600}
.hrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.hrow button{border:0;background:var(--soft);border-radius:999px;padding:7px 12px;font-weight:500;font-size:14px}
.hrow button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.plist{display:grid;gap:8px}
.pl{position:relative;display:flex;align-items:center;gap:14px;border-radius:18px;padding:15px 16px;border:1px solid var(--line);cursor:pointer}
.pl:has(input:checked){border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.pl:has(input:focus-visible){outline:2px solid var(--ink);outline-offset:2px}
.pl input{position:absolute;opacity:0}
.pl .gb{font-family:var(--h);font-weight:600;font-size:22px;min-width:76px;letter-spacing:-.02em}
.pl .d{font-weight:500}
.pl .d span{display:block;font-size:13px;color:var(--muted);font-weight:400}
.pl .pz{margin-left:auto;font-weight:600}
.pl .rec{position:absolute;top:-9px;left:14px;font-size:11.5px;font-weight:600;background:var(--ink);color:var(--bg);border-radius:999px;padding:2px 8px}
.cov{font-size:14px;color:var(--muted);margin:12px 2px 0}
.fld{margin-top:16px}
.fld label{display:block;font-weight:600;margin-bottom:8px;font-size:15px}
.fld input[type=email]{width:100%;font:inherit;font-size:16px;padding:14px 16px;border:1px solid var(--line);background:var(--bg);border-radius:14px;color:var(--ink);outline:none}
.fld input[type=email]:focus{border-color:var(--ink)}
.fld .help{font-size:13.5px;color:var(--muted);margin-top:6px}
.fld .err{font-size:13.5px;color:var(--no);margin-top:6px;font-weight:500}
.pay{display:grid;gap:6px}
.pay label{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:14px;padding:13px 14px;font-weight:500;cursor:pointer}
.pay label:has(input:checked){border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.pay input{accent-color:var(--ink);width:17px;height:17px}
.pay small{margin-left:auto;color:var(--muted);font-size:13px}
.summary{display:flex;justify-content:space-between;align-items:center;background:var(--soft);border-radius:16px;padding:14px 16px}
.summary b{font-size:18px;font-weight:600}
.spin{width:40px;height:40px;border-radius:50%;border:3px solid var(--soft2);border-top-color:var(--ink);animation:sp .8s linear infinite;margin:80px auto 18px}
@keyframes sp{to{transform:rotate(360deg)}}
.done{text-align:center;padding-top:10px}
.done .okb{width:56px;height:56px;border-radius:50%;background:var(--ok);display:grid;place-items:center;margin:0 auto 14px;animation:pop .5s cubic-bezier(.2,1.3,.4,1)}
.done .okb .ic{width:28px;height:28px;stroke:#fff;stroke-width:2.6}
@keyframes pop{from{transform:scale(.5);opacity:0}}
.done h3{font-size:26px;margin-bottom:6px}
.qr{width:200px;height:200px;margin:20px auto;padding:12px;background:#fff;border-radius:18px;border:1px solid var(--line)}
.done ol{text-align:left;color:var(--muted);padding-left:20px;margin:0}
.done li{margin:5px 0}
@media (max-width:560px){.sheet{top:auto;left:0;right:0;bottom:0;width:100%;height:92%;border-radius:24px 24px 0 0;transform:translateY(102%)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}[data-r]{opacity:1;transform:none}}
</style>
</head>

  case 'pay':return `<div class="ms">${tb}<h4>${M.payment}</h4><div class="cd"><div style="opacity:.6">${n} · 5 ${G} · ${L('days')(30)}</div><div style="font-family:var(--h);font-size:2.3em;font-weight:600;margin-top:.2em;letter-spacing:-.03em">${money(14.9)}</div></div>${[[M.card,'Visa · Mastercard'],['Apple Pay',''],['Google Pay','']].map((x,i)=>`<div class="rw${i===(o.sel??0)?' on':''}">${x[0]}<span class="r">${x[1]}</span></div>`).join('')}<span class="b2">${M.pay}</span></div>`;
  case 'qr':return `<div class="ms">${tb}<div class="ok">${icon('i-check')}</div><h4 style="margin-top:.4em">${M.open}</h4><div class="sm">${M.qrSent}</div><div class="qq">${QRS}</div><span class="b2">${M.installEsim}</span></div>`;
  case 'install':return `<div class="ms">${tb}<h4>${M.install}</h4><div class="sm">${M.wifi}</div>${M.steps.map((x,i)=>`<div class="stp${i<(o.done??2)?' dn':''}"><i>${i+1}</i>${x}</div>`).join('')}<span class="b2" style="margin-top:1.6em">${M.done}</span></div>`;
  case 'usage':return `<div class="ms">${tb}<h4>${M.my}</h4><div class="cd"><div style="display:flex;justify-content:space-between;align-items:center"><span style="display:flex;gap:.5em;align-items:center">${flag(c)}${n}</span><span class="pill">${M.active}</span></div><div class="rg2" style="--v:${o.v||64}"><div><span><b>3${M.dec}2</b><br><span style="opacity:.55">${M.left}</span></span></div></div><div style="display:flex;justify-content:space-between;opacity:.55"><span>${M.daysLeft(24)}</span><span>5G</span></div></div><span class="b2 lt">${M.topup}</span></div>`;
  case 'topup':return `<div class="ms">${tb}<h4>${M.topup}</h4><div class="sm" style="margin-bottom:.4em">${M.leftGb}</div>${[[1,3.9],[3,9.9],[5,14.9]].map((x,i)=>`<div class="rw${i===1?' on':''}"><b style="font-weight:600">+${x[0]} ${G}</b><span class="r" style="color:#0A0A0A;font-weight:600">${money(x[1])}</span></div>`).join('')}<div class="sm" style="margin-top:1em">${M.same}</div><span class="b2">${M.topup}</span></div>`;
  case 'lock':return `<div class="ms lk">${tb}<div class="tm">14:05</div><div class="dt">${M.date}</div><div class="nt"><span class="ni">${ARC}</span><div><b>${M.online(L('cities')[o.city||'Dubai'])}</b><span>${M.open}</span></div></div><div class="nt"><span class="ni">${ARC}</span><div><b>${M.speed}</b><span>${M.hotspot}</span></div></div></div>`;
  case 'chat':return `<div class="ms">${tb}<div style="display:flex;gap:.6em;align-items:center;padding-bottom:.8em;border-bottom:1px solid #EFEFED"><span style="width:2.6em;height:2.6em;border-radius:50%;background:#F5F5F4;display:grid;place-items:center"><svg viewBox="0 0 64 64" style="width:1.6em;height:1.6em;color:#0A0A0A"><use href="#arch"/></svg></span><div><b style="font-weight:600">${M.support}</b><div style="color:#1A9E5C;font-size:.85em">${M.inNet}</div></div></div><div class="bb me">${M.c1}</div><div class="bb th">${M.c2}</div><div class="bb me">${M.c3}</div></div>`;
  }
}

/* static text */
function applyStatic(){
  document.documentElement.lang=lang;document.title=L('meta.title');
  const md=document.querySelector('meta[name=description]');if(md)md.setAttribute('content',L('meta.desc'));
  $$('[data-i18n]').forEach(el=>{const v=L(el.dataset.i18n);if(typeof v==='string')el.innerHTML=v});
  $$('[data-i18n-ph]').forEach(el=>el.setAttribute('placeholder',L(el.dataset.i18nPh)));
  $$('[data-i18n-aria]').forEach(el=>el.setAttribute('aria-label',L(el.dataset.i18nAria)));
  $$('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===lang));
  $('#tPrice').textContent=`${L('from')} ${money(PACKS[0].usd)}`;
}

  $('#hDays').onclick=e=>{const b=e.target.closest('[data-d]');if(!b)return;st.days=+b.dataset.d;st.pack=recommend();stepPlans()};
  $('#hUse').onclick=e=>{const b=e.target.closest('[data-u]');if(!b)return;st.use=b.dataset.u;st.pack=recommend();stepPlans()}}
function footPlans(){const S=L('sh'),p=PACKS[st.pack];F.innerHTML=`<button class="btn btn-ink" id="go">${S.cont(money(p.usd*st.dest.k))}</button><p class="fine">${S.qrSoon}</p>`;$('#go').onclick=stepForm}
function stepForm(){step='form';head(stepPlans);const S=L('sh'),d=st.dest,p=PACKS[st.pack];
  B.innerHTML=`<div class="summary"><span>${p.gb} ${L('gb')} · ${L('days')(p.days)}</span><b>${money(p.usd*d.k)}</b></div>
  <div class="fld"><label for="em">${S.where}</label><input type="email" id="em" placeholder="you@gmail.com" autocomplete="email" inputmode="email" value="${esc(st.email)}"><div class="help">${S.noReg}</div><div class="err" id="emErr" hidden>${S.err}</div></div>
  <div class="fld"><label>${S.method}</label><div class="pay">${[['card',S.card,'Visa, Mastercard'],['apple','Apple Pay',''],['google','Google Pay','']].map(([v,t,s])=>`<label><input type="radio" name="pay" value="${v}" ${st.pay===v?'checked':''}>${t}${s?`<small>${s}</small>`:''}</label>`).join('')}</div></div>`;
  F.innerHTML=`<button class="btn btn-ink" id="payBtn">${S.pay(money(p.usd*d.k))}</button><p class="fine">${S.refund}</p>`;
  $('#em').oninput=e=>{st.email=e.target.value;$('#emErr').hidden=true};B.querySelectorAll('input[name=pay]').forEach(r=>r.onchange=()=>st.pay=r.value);
  $('#payBtn').onclick=()=>{if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(st.email.trim())){$('#emErr').hidden=false;$('#em').focus();return}
    step='pay';head(null);B.innerHTML=`<div class="spin" role="status" aria-label="${S.processingAria}"></div><p class="muted" style="text-align:center">${S.processing}</p>`;F.innerHTML='';setTimeout(stepDone,reduce?300:1500)};
  setTimeout(()=>$('#em').focus(),60)}
function stepDone(){step='done';head(null);const S=L('sh'),d=st.dest,p=PACKS[st.pack];
  B.innerHTML=`<div class="done"><div class="okb">${icon('i-check')}</div><h3>${S.done}</h3><p class="muted">${S.sent(esc(nm(d)),p.gb,L('days')(p.days),esc(st.email))}</p><div class="qr" role="img" aria-label="${S.qrAria}">${qr()}</div><ol>${S.steps.map(x=>`<li>${x}</li>`).join('')}</ol></div>`;
  F.innerHTML=`<button class="btn btn-ink" id="inst">${S.installBtn}</button><p class="fine">${S.other}</p>`;
  $('#inst').onclick=()=>$('#inst').textContent=S.demo}

/* app install: PWA + store links */
const STORES={ios:'',android:''}; // вставьте ссылки на App Store / Google Play, когда приложения опубликуют
const ua=navigator.userAgent;
const isAndroid=/Android/i.test(ua);
const isIOS=/iPad|iPhone|iPod/.test(ua)||(!isAndroid&&navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const isSafari=/Safari/.test(ua)&&!/CriOS|FxiOS|EdgiOS|OPiOS|YaBrowser/.test(ua);
const standalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const dlg=$('#appDlg'),dlgIn=$('#dlgIn'),abar=$('#abar');
let bip=null,installed=standalone(),dlgMode=null;
const canInstall=()=>!installed&&(bip||isIOS);
function renderApp(){const A=L('appd');
  $('#appInstallT').textContent=installed?A.installed:A.install;
  $('#appNote').textContent=installed?(standalone()?A.open:A.done):bip?A.ready:isIOS?A.ios:A.other;
  $$('.app-c').forEach(c=>c.classList.toggle('mine',(c.dataset.plat==='ios'&&isIOS)||(c.dataset.plat==='android'&&isAndroid)));
  [['ios','#storeIos'],['android','#storeAndroid']].forEach(([k,id])=>{$(id).href=STORES[k]||'#';$(`[data-soon="${k}"]`).hidden=!!STORES[k]});
  if(dlg.open)renderDlg()}
function renderDlg(){const A=L('appd'),m=dlgMode,store=m==='soon-ios'?'App Store':'Google Play';
  const steps=(a,ics)=>`<ol>${a.map((t,i)=>`<li>${t}${ics&&ics[i]?icon(ics[i]):''}</li>`).join('')}</ol>`;
  const h=m==='ios'?A.iosH:m==='done'?A.doneH:m==='other'?A.otherH:A.soonH(store);
  const body=m==='ios'?`<p>${A.iosP}</p>${steps(A.iosSteps,['i-share','i-addhome'])}${isSafari?'':`<p style="font-size:14px">${A.iosNoSafari}</p>`}`
    :m==='other'?`<p>${A.otherP}</p>${steps(A.otherSteps)}<p style="font-size:14px">${A.otherTip}</p>`
    :m==='done'?`<p>${A.doneP}</p>`:`<p>${A.soonP}</p>`;
  const btn=m&&m.startsWith('soon')&&!installed?`<button class="btn btn-gold" type="button" id="dlgGo">${A.soonB}</button>`:`<button class="btn btn-ink" type="button" id="dlgOk">${A.ok}</button>`;
  dlgIn.innerHTML=`<div class="dlg-h"><img src="icons/icon-192.png" alt=""><b id="dlgTitle">${h}</b><button class="sh-x" type="button" id="dlgX" aria-label="${A.close}">${icon('i-x')}</button></div>${body}${btn}`;
  $('#dlgX').onclick=()=>dlg.close();
  const ok=$('#dlgOk');if(ok)ok.onclick=()=>dlg.close();
  const go=$('#dlgGo');if(go)go.onclick=()=>{dlg.close();webInstall()}}
function openDlg(m){dlgMode=m;renderDlg();if(!dlg.open)dlg.showModal()}
dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close()});
function webInstall(){
  if(installed)return openDlg('done');
  if(bip){const p=bip;bip=null;p.prompt();p.userChoice.then(c=>{if(c.outcome==='accepted'){installed=true;hideBar()}renderApp()});return}
  openDlg(isIOS?'ios':'other')}
$('#appInstall').onclick=webInstall;
[['#storeIos','soon-ios','ios'],['#storeAndroid','soon-android','android']].forEach(([id,m,k])=>$(id).addEventListener('click',e=>{if(!STORES[k]){e.preventDefault();openDlg(m)}}));
/* smart bar: phones only, after scrolling past the hero, once per dismissal */
const BAR_KEY='sezam-abar-off';
const barOff=()=>{try{return localStorage.getItem(BAR_KEY)==='1'}catch(e){return false}};
function showBar(){abar.classList.add('on');abar.setAttribute('aria-hidden','false');abar.querySelectorAll('button').forEach(b=>b.tabIndex=0)}
function hideBar(){abar.classList.remove('on');abar.setAttribute('aria-hidden','true');abar.querySelectorAll('button').forEach(b=>b.tabIndex=-1)}
function maybeBar(){if(canInstall()&&!barOff()&&scrollY>innerHeight*.8&&innerWidth<=700)showBar()}
addEventListener('scroll',maybeBar,{passive:true});
$('#abarGo').onclick=()=>{hideBar();webInstall()};
$('#abarX').onclick=()=>{hideBar();try{localStorage.setItem(BAR_KEY,'1')}catch(e){}};
addEventListener('beforeinstallprompt',e=>{e.preventDefault();bip=e;renderApp();maybeBar()});
addEventListener('appinstalled',()=>{installed=true;bip=null;hideBar();renderApp()});
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));

/* render all + language switch */
function renderAll(){applyStatic();renderPop();renderGrid();renderXP();renderPics();renderBrands();renderVerdict();renderFaq();globe.relabel();renderApp();
  if(sheet.classList.contains('on')){if(step==='plans')stepPlans();else if(step==='form')stepForm();else if(step==='done')stepDone()}}
$$('[data-lang]').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.lang===lang)return;lang=b.dataset.lang;try{localStorage.setItem('sezam-lang',lang)}catch(e){}if(document.activeElement!==q&&q.value)q.value='';renderAll()}));
renderAll();
})();

</script>
</body>
</html>
